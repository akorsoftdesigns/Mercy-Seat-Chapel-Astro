# Publishes the Astro version to its preview link (GitHub Pages of this repository):
#   https://akorsoftdesigns.github.io/Mercy-Seat-Chapel-Astro/
# It never uploads to SiteGround and never changes the live site
# (the live upload is a separate workflow, publish-live.yml, switched off until switchover).
#
# Runs when:
#   - code is pushed to main,
#   - every 30 minutes (keeps the events slider, next-date badges and YouTube lists current),
#   - someone publishes in the dashboard, if a Sanity webhook is pointed at this repository
#     (repository_dispatch "sanity-publish"; optional, see docs/deployment-astro.md),
#   - or from GitHub → Actions → "Publish preview" → "Run workflow".
# Needs GitHub → Settings → Pages → Source = "GitHub Actions".
# Every preview page carries "noindex" so search engines leave it out.
name: Publish preview

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer run replaces a waiting one
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Latest published dashboard content (read-only); if Sanity can't be reached,
      # the saved content in src/data/cms-snapshot.json is used
      - name: Fetch dashboard content
        run: npm run content || echo "Using the saved content"

      - name: Build
        env:
          SITE_BASE: /Mercy-Seat-Chapel-Astro/
          SITE_PREVIEW: "1"
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
